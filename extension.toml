# Gemini CLI: a client (kind `client`). `pointman add gemini` installs npm's package on every node that has
# none, in the node's own folder; a copy a person installed themselves stays theirs. Nodes don't run agents
# on it yet.

[extension]
id = "gemini"
name = "Gemini CLI"
version = "0.1.1"
publisher = "aurelio"
summary = "Google's coding agent. Nodes don't run agents on it yet."

[client]
npm = "@google/gemini-cli"
